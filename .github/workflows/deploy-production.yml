name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag/SHA to deploy for rollback. Leave empty to build and deploy this commit."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-hr-web-client
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/hacom-holding-dx/hr-web-client
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && inputs.image_tag || github.sha }}
  DEPLOY_DIR: ${{ vars.SERVER_APPS_ROOT != '' && vars.SERVICE_NAME != '' && format('{0}/{1}', vars.SERVER_APPS_ROOT, vars.SERVICE_NAME) || '/opt/hacom/hr-web-client' }}
  SERVER_RUNTIME_ENV_FILE: ${{ vars.SERVER_RUNTIME_ENV_FILE }}
  HR_API_HEALTH_URL: ${{ vars.HR_API_HEALTH_URL }}

jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hr-web-client
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build HR Web
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Skip build for rollback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
        shell: bash
        run: echo "Rollback mode: using existing image tag ${IMAGE_TAG}"

  docker-build-push:
    needs: test-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hr-web-client
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push runtime image
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_HR_API_BASE_URL != '' && vars.VITE_HR_API_BASE_URL || '/api/v1' }}
          VITE_USE_MOCKS: "false"
          VITE_AUTH_MODE: ${{ vars.VITE_HR_AUTH_MODE != '' && vars.VITE_HR_AUTH_MODE || 'chat-auth' }}
          VITE_APP_SYSTEM_CODE: ${{ vars.VITE_APP_SYSTEM_CODE != '' && vars.VITE_APP_SYSTEM_CODE || 'HRM' }}
          VITE_AUTH_SERVICE_CLIENT_ID: ${{ vars.VITE_AUTH_SERVICE_CLIENT_ID != '' && vars.VITE_AUTH_SERVICE_CLIENT_ID || vars.VITE_CHAT_AUTH_CLIENT_ID != '' && vars.VITE_CHAT_AUTH_CLIENT_ID || 'hr-web-client' }}
          VITE_AUTH_SERVICE_REDIRECT_URI: ${{ vars.VITE_AUTH_SERVICE_REDIRECT_URI != '' && vars.VITE_AUTH_SERVICE_REDIRECT_URI || vars.VITE_CHAT_AUTH_REDIRECT_URI != '' && vars.VITE_CHAT_AUTH_REDIRECT_URI || '/auth/callback' }}
          VITE_CHAT_AUTH_CLIENT_ID: ${{ vars.VITE_CHAT_AUTH_CLIENT_ID != '' && vars.VITE_CHAT_AUTH_CLIENT_ID || 'hr-web-client' }}
          VITE_CHAT_AUTH_REDIRECT_URI: ${{ vars.VITE_CHAT_AUTH_REDIRECT_URI != '' && vars.VITE_CHAT_AUTH_REDIRECT_URI || '/auth/callback' }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file Dockerfile \
            --target production \
            --platform linux/amd64 \
            --push \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            --build-arg VITE_USE_MOCKS="${VITE_USE_MOCKS}" \
            --build-arg VITE_AUTH_MODE="${VITE_AUTH_MODE}" \
            --build-arg VITE_APP_SYSTEM_CODE="${VITE_APP_SYSTEM_CODE}" \
            --build-arg VITE_AUTH_SERVICE_CLIENT_ID="${VITE_AUTH_SERVICE_CLIENT_ID}" \
            --build-arg VITE_AUTH_SERVICE_REDIRECT_URI="${VITE_AUTH_SERVICE_REDIRECT_URI}" \
            --build-arg VITE_CHAT_AUTH_CLIENT_ID="${VITE_CHAT_AUTH_CLIENT_ID}" \
            --build-arg VITE_CHAT_AUTH_REDIRECT_URI="${VITE_CHAT_AUTH_REDIRECT_URI}" \
            .

      - name: Verify image manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  deploy-production:
    needs: docker-build-push
    runs-on: ubuntu-24.04
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME != '' && secrets.GHCR_PULL_USERNAME || github.repository_owner }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - name: Checkout hr-web-client
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY
            SERVER_SSH_KNOWN_HOSTS GHCR_PULL_TOKEN DEPLOY_DIR SERVER_RUNTIME_ENV_FILE
            HR_API_HEALTH_URL
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required configuration: ${name}" >&2; exit 1; }
          done
          case "${SERVER_PORT}" in
            ''|*[!0-9]*) echo "SERVER_PORT must be digits only" >&2; exit 1 ;;
          esac
          echo "Deploying ${IMAGE_REPOSITORY}:${IMAGE_TAG} to production"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known_hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SERVER_SSH_KNOWN_HOSTS}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts="-o BatchMode=yes -o StrictHostKeyChecking=yes -p ${SERVER_PORT}"
          ssh ${ssh_opts} "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${DEPLOY_DIR}/deploy' '${DEPLOY_DIR}/env'"
          rsync -az --delete \
            -e "ssh ${ssh_opts}" \
            ./deploy/ \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_DIR}/deploy/"

      - name: Deploy hr-web-client on production server
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            bash -se -- "${DEPLOY_DIR}" "${IMAGE_TAG}" "${GHCR_PULL_USERNAME}" "${SERVER_RUNTIME_ENV_FILE}" "${HR_API_HEALTH_URL}" <<EOF
          set -Eeuo pipefail
          deploy_dir="\$1"
          image_tag="\$2"
          ghcr_username="\$3"
          runtime_env_file="\$4"
          hr_api_health_url="\$5"
          cd "\${deploy_dir}"
          test -f "\${runtime_env_file}"
          test -n "\${hr_api_health_url}" || { echo "ERROR: HR_API_HEALTH_URL missing" >&2; exit 64; }
          echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "\${ghcr_username}" --password-stdin
          chmod +x deploy/scripts/deploy-production.sh deploy/scripts/smoke-production.sh
          SERVER_RUNTIME_ENV_FILE="\${runtime_env_file}" \
          HR_WEB_VERSION="\${image_tag}" \
          HR_API_HEALTH_URL="\${hr_api_health_url}" \
          COMPOSE_FILE="deploy/compose/production.yml" \
          deploy/scripts/deploy-production.sh
          EOF

      - name: Show remote logs on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            bash -se -- "${DEPLOY_DIR}" "${SERVER_RUNTIME_ENV_FILE}" <<'EOF'
          set +e
          deploy_dir="$1"
          runtime_env_file="$2"
          cd "${deploy_dir}" || exit 0
          versions_env_file="$(dirname "${runtime_env_file}")/.hr-web-client.versions"
          compose_args=(-p hr-prod --env-file "${runtime_env_file}")
          if [ -f "${versions_env_file}" ]; then
            compose_args+=(--env-file "${versions_env_file}")
          else
            export HR_WEB_VERSION=log-tail
          fi
          export HR_WEB_ENV_FILE="${runtime_env_file}"
          docker compose "${compose_args[@]}" -f deploy/compose/production.yml ps hr-web-client
          docker compose "${compose_args[@]}" -f deploy/compose/production.yml logs --tail=200 hr-web-client
          EOF

  verify:
    needs: deploy-production
    runs-on: ubuntu-24.04
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      SERVER_RUNTIME_ENV_FILE: ${{ vars.SERVER_RUNTIME_ENV_FILE }}
      HR_API_HEALTH_URL: ${{ vars.HR_API_HEALTH_URL }}
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known_hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SERVER_SSH_KNOWN_HOSTS}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run HR Web production smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${HR_API_HEALTH_URL:-}" || { echo "ERROR: HR_API_HEALTH_URL missing" >&2; exit 64; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "cd '${DEPLOY_DIR}' && SERVER_RUNTIME_ENV_FILE='${SERVER_RUNTIME_ENV_FILE}' HR_API_HEALTH_URL='${HR_API_HEALTH_URL}' COMPOSE_FILE='deploy/compose/production.yml' deploy/scripts/smoke-production.sh"
